<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Căn Gác Xép | Harusama</title>
  <meta name="description" content="Nơi cất giữ những bản nháp lộn xộn." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />

  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/cursor.css" />

  <style>
    body {
      background: #0a0a0a;
      color: #78716c;
    }

    /* Heavy noise overlay */
    .heavy-noise {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      background-image: url("./assets/images/dust.png");
      opacity: 0.15;
      mix-blend-mode: overlay;
    }

    .attic-header {
      text-align: center;
      padding-top: 60px;
      margin-bottom: 20px;
    }

    .attic-header h1 {
      font-family: var(--serif);
      color: #57534e;
      font-size: 2rem;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
    }

    .draft-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed #292524;
      padding: 24px;
      margin-bottom: 24px;
      font-family: monospace;
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    .draft-card:hover {
      opacity: 1;
      border-color: #57534e;
    }

    .strike {
      text-decoration: line-through;
      color: #3f3f46;
    }

    .deleted-draft {
      filter: blur(4px);
      opacity: 0.3 !important;
      user-select: none;
      transition: filter 0.4s ease, opacity 0.4s ease;
    }

    .deleted-draft:hover {
      filter: blur(0px);
      opacity: 1 !important;
    }
  </style>
</head>

<body>
  <div class="vintage-cursor-glow"></div>
  <div class="heavy-noise"></div>

  <main class="page-shell">
    <header class="attic-header">
      <div style="display: flex; gap: 12px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap;">
        <a href="rooftop.html" class="room-memories">↑ Lên Ban Công (Tầng Thượng)</a>
        <a href="index.html" class="room-memories">↓ Quay lại Phòng Chính</a>
      </div>
      <h1>CĂN GÁC XẾP</h1>
      <p style="font-size: 0.8rem; letter-spacing: 1px;">Những thứ không hoàn hảo</p>
    </header>

    <section class="section" id="drafts-container">
      <!-- Drafts will be injected here by attic.js -->
    </section>



    <!-- Admin Hidden Form -->
    <section class="section" id="admin-draft-section"
      style="display: none; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 24px; margin-top: 40px;">
      <h3 style="font-family: var(--serif); color: #fbbf24; font-size: 1.2rem; margin-bottom: 16px;">[ADMIN] Viết Nháp
        Mới</h3>
      <form id="admin-draft-form"
        style="display: flex; flex-direction: column; gap: 12px; font-family: 'Plus Jakarta Sans', sans-serif;">
        <input type="text" id="draft-strikethrough" placeholder="Tin nhắn định gửi nhưng lại xóa (Gạch ngang)" required
          style="padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 6px;">
        <input type="text" id="draft-final" placeholder="Tin nhắn thực sự gửi đi" required
          style="padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 6px;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="draft-blur" style="width: 16px; height: 16px;">
          <label for="draft-blur" style="font-size: 14px; color: #a1a1aa;">Làm mờ bản nháp này (Blur)</label>
        </div>
        <button type="submit"
          style="padding: 12px; background: #fbbf24; color: #000; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s;">Lưu
          vào Căn Gác Xép</button>
      </form>
    </section>

    <footer class="page-footer" style="opacity: 0.3;">
      <p>EST. 2026 — ARCHIVED</p>
    </footer>
  </main>

  <script src="./js/cursor.js"></script>
  <script src="./js/minimap.js"></script>
  <script type="module" src="./js/attic.js"></script>
</body>

</html>

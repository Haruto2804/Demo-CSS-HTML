<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Góc Ban Công | Harusama</title>
  <meta name="description" content="Chỉ có tiếng mưa và những đài radio vô tuyến." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />

  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/cursor.css" />
  <link rel="stylesheet" href="./css/premium-radio.css" />

  <style>
    body {
      background: #0f0a19;
      color: #e2e8f0;
      overflow-x: hidden;
      margin: 0;
    }

    /* Full-screen background that works on ALL devices */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('./assets/images/rooftop.png') no-repeat center center;
      background-size: cover;
      z-index: 0;
    }

    .page-shell {
      background: transparent;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 24px;
    }

    /* Rain */
    .rain-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: url('data:image/svg+xml;utf8,<svg width="20" height="20" xmlns="http://www.w3.org/2000/svg"><line x1="10" y1="0" x2="10" y2="10" stroke="%23667799" stroke-width="0.5" stroke-dasharray="2, 8" /></svg>') repeat;
      animation: rainFall 0.5s linear infinite;
      opacity: 0.3;
    }

    @keyframes rainFall {
      0% { transform: translateY(0); }
      100% { transform: translateY(20px); }
    }

    .room-navigation {
      margin-bottom: 24px;
      z-index: 10;
      align-self: center;
    }

    .room-navigation .section-content {
      padding: 0;
    }

    .door-card {
      background: rgba(15, 10, 25, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 50px;
    }

    /* Dark overlay behind radio */
    .radio-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 4;
      opacity: 1;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .radio-overlay.hidden { opacity: 0; }

    /* Minimize button on radio */
    .radio-minimize-btn {
      position: absolute;
      top: 12px; right: 12px;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: all 0.2s;
    }
    .radio-minimize-btn:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }

    /* Radio wrapper transition */
    .premium-radio-wrapper {
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .premium-radio-wrapper.minimized {
      opacity: 0;
      transform: scale(0.8) translateY(40px);
      pointer-events: none;
    }

    /* Mini floating player */
    .mini-player {
      position: fixed;
      bottom: 24px; left: 24px;
      background: rgba(28, 28, 30, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50px;
      padding: 10px 20px 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 50;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 60px rgba(56, 189, 248, 0.05);
      transform: scale(0) translateY(20px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .mini-player.visible {
      transform: scale(1) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .mini-player:hover {
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 80px rgba(56, 189, 248, 0.1);
      border-color: rgba(74, 222, 128, 0.3);
    }
    .mini-player .mini-play-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #4ade80;
      border: none;
      color: #0a0a12;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .mini-player .mini-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .mini-player .mini-title {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }
    .mini-player .mini-sub {
      font-size: 10px;
      color: #64748b;
      white-space: nowrap;
    }
    .mini-player .mini-expand {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: none;
      color: #94a3b8;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
  </style>
</head>

<body>
  <div class="vintage-cursor-glow"
    style="background: radial-gradient(circle at center, rgba(56, 189, 248, 0.15) 0%, transparent 60%);"></div>
  <div class="rain-overlay"></div>
  <div class="radio-overlay" id="radio-overlay"></div>

  <!-- Mini floating player (shown when radio is minimized) -->
  <div class="mini-player" id="mini-player">
    <button class="mini-play-btn" id="mini-play-btn"><i class="fa-solid fa-play"></i></button>
    <div class="mini-info">
      <span class="mini-title" id="mini-title">Là Chính Mình</span>
      <span class="mini-sub" id="mini-sub">Vietnam · 88.5 MHz</span>
    </div>
    <button class="mini-expand" id="mini-expand" title="Mở rộng"><i class="fa-solid fa-up-right-and-down-left-from-center"></i></button>
  </div>

  <main class="page-shell" style="padding-top: 40px;">
    <div style="display: flex; gap: 12px; justify-content: center; margin-bottom: 40px; flex-wrap: wrap;">
      <a href="attic.html" class="room-memories" style="background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);">↓ Trở xuống Gác Xép</a>
    </div>
    <div class="premium-radio-wrapper" id="radio-wrapper" style="margin-bottom: 24px; align-self: center; position: relative; z-index: 5;">
      <button class="radio-minimize-btn" id="radio-minimize" title="Thu nhỏ"><i class="fa-solid fa-minus"></i></button>
      <!-- Left Panel: Tuning & Display -->
      <div class="radio-panel panel-left">
        <div class="radio-display-wrapper">
          <div class="led-display">
            <div class="led-top">
              <span class="led-band" id="pr-band">FM 1</span>
            </div>
            <div class="led-main">
              <span class="led-freq" id="pr-freq">97.2</span>
              <span class="led-unit">MHz</span>
            </div>
          </div>
          <div class="display-info">
            <h3 class="info-title" id="pr-title">the Theater Back to</h3>
            <p class="info-subtitle" id="pr-subtitle">The Daily</p>
            <div class="info-timer">
              <i class="fa-regular fa-clock"></i> <span id="pr-time">45 mins</span> <i
                class="fa-solid fa-chevron-right"></i>
            </div>
          </div>
        </div>

        <div class="tuning-scale">
          <div class="scale-ticks"></div>
          <div class="scale-labels">
            <span>80</span>
            <span>90</span>
            <span>100</span>
            <span>110</span>
          </div>
          <div class="tuning-needle" id="pr-needle"></div>
        </div>

        <div class="left-actions">
          <button class="action-btn"><i class="fa-solid fa-star"></i></button>
          <div class="band-toggle">
            <span class="band active">FM</span>
            <span class="band-dot">•</span>
            <span class="band">AM</span>
          </div>
          <button class="action-btn"><i class="fa-solid fa-tower-broadcast"></i></button>
        </div>
      </div>

      <!-- Right Panel: Stations & Media -->
      <div class="radio-panel panel-right">
        <div class="right-header">
          <div class="radio-area-btn">
            <span class="area-label">RADIO AREA</span>
            <span class="area-value">Default <i class="fa-solid fa-chevron-right"
                style="font-size:12px;margin-left:4px;"></i></span>
          </div>
          <button class="stereo-btn">
            <i class="fa-solid fa-headphones"></i>
            <span>STEREO</span>
          </button>
        </div>

        <div class="stations-section">
          <div class="stations-header">
            <span class="stations-count">Stations <span class="dot">•</span> <span id="pr-count">4</span></span>
            <span class="auto-search">Auto Search <i class="fa-solid fa-magnifying-glass"></i></span>
          </div>
          <div class="stations-list" id="pr-stations">
            <!-- Stations will be dynamically injected here by premium-radio.js -->
          </div>
        </div>

        <div class="media-section">
          <div class="sliders-row">
            <div class="slider-group">
              <label>Tempo</label>
              <input type="range" class="mini-slider" value="50">
            </div>
            <div class="slider-group">
              <label>Equalizer <i class="fa-solid fa-caret-right"></i></label>
            </div>
          </div>

          <div class="media-controls">
            <button class="media-btn" id="pr-prev"><i class="fa-solid fa-backward-step"></i></button>
            <button class="media-btn"><i class="fa-solid fa-backward-fast"></i></button>
            <button class="media-btn play-pause" id="pr-play"><i class="fa-solid fa-play"></i></button>
            <button class="media-btn"><i class="fa-solid fa-forward-fast"></i></button>
            <button class="media-btn" id="pr-next"><i class="fa-solid fa-forward-step"></i></button>

            <div class="volume-knob-wrapper">
              <span class="vol-minus">-</span>
              <div class="volume-knob" id="pr-vol-knob">
                <i class="fa-solid fa-volume-high"></i>
                <div class="knob-indicator"></div>
              </div>
              <span class="vol-plus">+</span>
            </div>
          </div>
        </div>
      </div>
    </div>

  </main>
  <script src="./js/premium-radio.js"></script>
  <script src="./js/cursor.js"></script>
  <script src="./js/minimap.js"></script>
</body>

</html>

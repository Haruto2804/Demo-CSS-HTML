<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Detail | Harusama Archive</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/skeleton.css" />
    <link rel="stylesheet" href="./css/cursor.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/auth-bar.css" />
    <link rel="stylesheet" href="./css/gallery.css" />
    <link rel="stylesheet" href="./css/photo-detail-split.css" />
  </head>

  <body class="gallery-page detail-page">
    <div class="auth-topbar" data-auth-topbar>
      <button
        class="auth-mobile-trigger"
        type="button"
        data-auth-toggle
        aria-label="Mở menu tài khoản"
        aria-expanded="false"
      >
        <img
          class="auth-avatar-mini"
          data-user-avatar
          hidden
          alt="User avatar"
        />
        <span data-user-name>Guest</span>
        <i class="fa-solid fa-chevron-down"></i>
      </button>

      <div class="auth-panel">
        <div class="auth-user">
          <img class="auth-avatar" data-user-avatar hidden alt="User avatar" />

          <div class="auth-user-info">
            <span class="auth-name" data-user-name>Guest</span>
            <span class="auth-email" data-user-email
              >Đăng nhập để mở khóa phòng</span
            >
          </div>
        </div>

        <div class="auth-actions">
          <a
            class="auth-btn auth-login-btn"
            href="./login.html"
            data-login-link
          >
            <span>Đăng nhập</span>
          </a>

          <button
            class="auth-btn auth-logout-btn"
            type="button"
            data-logout-btn
            hidden
          >
            <span>Đăng xuất</span>
          </button>
        </div>
      </div>
    </div>

    <div class="vintage-cursor-glow"></div>
    <div class="page-texture"></div>

    <main class="split-layout-shell">
      <!-- Màn hình trái: Hiển thị hình ảnh -->
      <section class="split-left-pane">
        <a href="./gallery.html" class="detail-back floating-back">← Quay về</a>
        <article id="photoDetailMedia" class="photo-detail-media-container">
          <!-- SKELETON MEDIA -->
          <div class="skeleton-photo" style="width: 100%; height: 100%; border-radius: 0;"></div>
        </article>
      </section>

      <!-- Màn hình phải: Thông tin & Bình luận -->
      <section class="split-right-pane">
        
        <!-- Top Bar cho Desktop/Tablet (Mobile ẩn đi) -->
        <div class="split-top-bar">
          <div class="author-info" id="photoAuthorInfo">
            <img src="./assets/images/avatar.jpeg" class="author-avatar" alt="Author">
            <span class="author-name">@HARUTO_2804</span>
          </div>
          <div class="top-actions">
            <button class="icon-btn"><i class="fa-solid fa-share-nodes"></i></button>
            <button class="icon-btn"><i class="fa-solid fa-ellipsis"></i></button>
          </div>
        </div>

        <div class="split-scroll-content">
          <article id="photoDetailContent" class="photo-detail-info-container">
            <!-- SKELETON INFO -->
            <div style="display: flex; flex-direction: column; gap: 16px; padding: 24px;">
              <div class="skeleton-line small" style="width: 100px;"></div>
              <div class="skeleton-line big" style="height: 48px; width: 60%;"></div>
              <div class="skeleton-line" style="width: 40%;"></div>
              <div style="display: flex; gap: 24px; margin-top: 12px;">
                <div class="skeleton-line" style="width: 120px;"></div>
                <div class="skeleton-line" style="width: 150px;"></div>
              </div>
              <div style="margin-top: 12px;">
                <div class="skeleton-line" style="width: 100%; margin-bottom: 8px;"></div>
                <div class="skeleton-line" style="width: 90%; margin-bottom: 8px;"></div>
                <div class="skeleton-line" style="width: 75%;"></div>
              </div>
            </div>
          </article>

          <section class="detail-comments split-comments">
            <div class="comments-head">
              <h2>Bình luận</h2>
              <span class="comment-count-badge" id="detailCommentCountBadge">0</span>
            </div>

            <div id="commentList" class="comment-list">
              <p class="empty-text">Chưa có bình luận.</p>
            </div>
          </section>
        </div>

        <!-- Bottom Action Bar (Cố định ở dưới) -->
        <div class="split-bottom-bar">
          <div class="bottom-actions-row">
            <button id="detailLikeBtn" class="action-icon-btn" type="button">
              <i class="fa-regular fa-heart"></i>
              <span id="detailLikeCount" class="action-count">0</span>
            </button>
            <button class="action-icon-btn" type="button" onclick="document.getElementById('commentInput').focus()">
              <i class="fa-regular fa-comment"></i>
              <span id="detailCommentCount" class="action-count">0</span>
            </button>
            <button class="action-icon-btn bookmark-btn" type="button">
              <i class="fa-regular fa-bookmark"></i>
            </button>
          </div>
          
          <form id="commentForm" class="quick-comment-form">
            <img src="./assets/images/avatar.jpeg" class="quick-avatar" alt="User">
            <div class="input-wrapper">
              <input type="text" id="commentInput" maxlength="500" placeholder="Viết bình luận..." autocomplete="off">
              <button class="send-btn" type="submit"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <!-- Edit Photo Modal (Admin Only) -->
    <div id="editPhotoModal" class="edit-modal-overlay">
      <div class="edit-modal-content admin-form">
        <div class="edit-modal-header">
          <h3>Chỉnh sửa thông tin</h3>
          <button type="button" class="close-modal-btn" id="closeEditModalBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form id="editPhotoForm">
          <div class="form-grid">
            <label>
              Tiêu đề:
              <input type="text" id="editTitle" required>
            </label>
            <label>
              Danh mục:
              <select id="editCategory">
                <option value="memory">Memory</option>
                <option value="blog">Blog</option>
                <option value="portrait">Portrait</option>
                <option value="landscape">Landscape</option>
                <option value="film">Film</option>
              </select>
            </label>
            <label>
              Phụ đề (Subtitle):
              <input type="text" id="editSubtitle">
            </label>
            <label>
              Ngày chụp:
              <input type="text" id="editTakenAt" placeholder="Vd: 28/04/2005">
            </label>
            <label>
              Địa điểm:
              <input type="text" id="editLocation" placeholder="Vd: Hà Nội">
            </label>
            <label>
              Tags (cách nhau bởi dấu phẩy):
              <input type="text" id="editTags" placeholder="Vd: kỉ niệm, học sinh">
            </label>
          </div>
          <label style="margin-top: 14px;">
            Mô tả:
            <textarea id="editDescription" rows="5"></textarea>
          </label>
          <div class="admin-actions">
            <button type="submit" class="archive-btn primary">Lưu thay đổi</button>
            <button type="button" class="archive-btn ghost" id="cancelEditBtn">Hủy</button>
          </div>
        </form>
      </div>
    </div>

    <script src="./js/cursor.js"></script>
    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/photo-detail.js"></script>
    <script src="./js/skeleton.js"></script>
  </body>
</html>
